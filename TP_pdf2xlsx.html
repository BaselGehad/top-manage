<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to Excel | Top Manage</title>
<meta name="theme-color" content="#3b2d29">
<link rel="stylesheet" href="tm.css?v=26">
<script src="tm.js?v=26"></script>
<style>
.pk{margin-top:16px;border:1.5px dashed var(--g2);border-radius:20px;padding:26px 16px;text-align:center;background:linear-gradient(180deg,var(--card),var(--bg2));cursor:pointer}
.pk svg{width:34px;height:34px;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pk b{display:block;margin-top:8px;font-size:1rem}
.pk small{display:block;margin-top:4px;color:var(--muted);font-size:.8rem}
.fl{margin-top:14px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.fl i{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--over);display:grid;place-items:center}
.fl i svg{width:20px;height:20px;fill:none;stroke:var(--g);stroke-width:1.9}
.fl div{min-width:0;flex:1}.fl b{display:block;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.fl small{color:var(--muted);font-size:.78rem}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chips span{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;color:var(--muted);cursor:pointer}
.chips span.on{background:var(--over);border-color:var(--g2);color:var(--g);font-weight:600}
.lb{margin:16px 2px 0;font-size:.78rem;color:var(--muted)}
.go{margin-top:18px;width:100%;padding:13px;font-size:1rem;font-weight:700;border-radius:14px;border:0;background:linear-gradient(135deg,var(--g2),var(--g));color:#ffffff;cursor:pointer}
.go[disabled]{opacity:.45}
.pg{margin-top:16px}.pg .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pg .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px}
.pg .tx{display:flex;justify-content:space-between;margin-top:8px;font-size:.84rem;color:var(--muted)}
.nt{margin-top:12px;font-size:.8rem;color:var(--muted);line-height:1.6}
.pv{direction:ltr;margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--bg)}
.pv table{border-collapse:collapse;min-width:100%;direction:ltr;font-size:.8rem}
.pv th,.pv td{padding:7px 10px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);white-space:nowrap;text-align:start}
.pv th{background:var(--over);color:var(--g);font-weight:600;position:sticky;top:0}
.pv td.n{color:var(--muted)}
.ok{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:.88rem}
.ok em{font-style:normal;color:var(--g);background:var(--over);border:1px solid var(--g2);border-radius:999px;padding:2px 12px;font-size:.8rem}
.lk2{margin-top:14px;background:none;border:0;color:var(--muted);font-size:.84rem;text-decoration:underline;cursor:pointer;padding:0}
.s{display:none}.s.on{display:block}
h1 .fi{width:1.1em;height:1.1em;vertical-align:-.15em;margin-inline-end:.4em;fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<script>TM.bar({home:"index.html",lang:true})</script>
<main>
<h1><svg class="fi" viewBox="0 0 24 24"><path d="M6 2h8l4 4v6M6 2v20h6"/><path d="M14 2v4h4"/><rect x="13" y="14" width="9" height="8" rx="1"/><path d="M13 18h9M17.5 14v8"/></svg><span>PDF to Excel</span></h1>
<div id="v"></div>
</main>
<input type="file" id="fi" accept="application/pdf,.pdf" hidden>
<script src="pdfx.js?v=1"></script>
<script>
var T=TM.tt,$=function(i){return document.getElementById(i)};
var UPI='<svg viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 19h14"/></svg>',DOC='<svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v4h4M9 13h6M9 17h6"/></svg>';
var S={st:"idle",mode:"auto",lang:"en",file:null,doc:null,kind:"",pages:0,sheets:[],pct:0,err:""};
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chips(arr,cur,k){return '<div class="chips">'+arr.map(function(a){return '<span class="'+(a[0]===cur?"on":"")+'" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</span>'}).join("")+'</div>'}
function mb(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function useScan(){return S.mode==="scan"||(S.mode==="auto"&&S.kind==="scan")}
function view(){var h="";
 if(S.st==="idle"){h='<div class="pk" id="pk">'+UPI+'<b>'+T("اختر ملف PDF","Choose a PDF")+'</b><small>'+T("يعمل على الجهاز فقط","Stays on this device")+'</small></div>'+(S.err?'<div class="nt">'+esc(S.err)+'</div>':'')}
 else{
  h='<div class="fl"><i>'+DOC+'</i><div><b>'+esc(S.file.name)+'</b><small>'+S.pages+' '+T("صفحة","pages")+' · '+mb(S.file.size)+'</small></div></div>';
  h+='<div class="lb">'+T("النوع","Type")+'</div>'+chips([["auto",T("تلقائي","Auto")],["digital",T("نصي","Digital")],["scan",T("مصوّر (OCR)","Scan (OCR)")]],S.mode,"mode");
  if(S.st==="ready"||S.st==="done"){
   if(useScan()){h+='<div class="nt">'+T("هذا الملف مصوّر ولا يحتوي نصًا. قراءة الصور (OCR) تُضاف في الخطوة التالية.","This file is scanned (no text inside). OCR comes in the next step.")+'</div><button class="go" disabled>'+T("قريبًا","Coming soon")+'</button>'}
   else if(S.kind==="scan"&&S.mode==="digital"){h+='<div class="nt">'+T("لا نص داخل الملف، وقد تكون النتيجة فارغة.","No text found in this file; the result may be empty.")+'</div><button class="go" id="go">'+T("حوّل إلى Excel","Convert to Excel")+'</button>'}
   else if(S.st==="ready"){h+='<div class="nt">'+T("وُجد نص داخل الملف: سيُستخرج مباشرة وبسرعة.","Text found in the file: extracted directly and fast.")+'</div><button class="go" id="go">'+T("حوّل إلى Excel","Convert to Excel")+'</button>'}
   if(S.st==="done"){h+='<div class="ok"><span>'+T("اكتمل التحويل","Done")+'</span><em>'+S.sheets.length+' '+T("ورقة","sheets")+'</em></div>'+prev()+'<button class="go" id="dl">'+T("تنزيل Excel","Download Excel")+'</button>'}
  }
  if(S.st==="busy")h+='<div class="pg"><div class="bar"><b style="width:'+S.pct+'%"></b></div><div class="tx"><span>'+T("صفحة","Page")+' '+S.cur+' / '+S.pages+'</span><span>'+S.pct+'%</span></div></div><button class="go" disabled>'+T("جارٍ التحويل...","Converting...")+'</button>';
  h+='<button class="lk2" id="other">'+T("ملف آخر","Another file")+'</button>';
 }
 $("v").innerHTML=h;
 var pk=$("pk");if(pk)pk.onclick=function(){$("fi").click()};
 var o=$("other");if(o)o.onclick=function(){$("fi").value="";S.st="idle";S.err="";view()};
 var g=$("go");if(g)g.onclick=convert;var d=$("dl");if(d)d.onclick=download;
 [].forEach.call(document.querySelectorAll(".chips span"),function(e){e.onclick=function(){S[e.dataset.k]=e.dataset.v;if(S.st==="done"&&useScan())S.st="ready";view()}})}
function prev(){var sh=null;for(var i=0;i<S.sheets.length;i++)if(S.sheets[i].rows.length){sh=S.sheets[i];break}
 if(!sh)return '<div class="nt">'+T("لا توجد بيانات.","No data found.")+'</div>';
 var r=sh.rows.slice(0,8),w=Math.min(8,Math.max.apply(null,r.map(function(x){return x.length})));
 return '<div class="lb">'+esc(sh.name)+'</div><div class="pv"><table>'+r.map(function(x,i){var c="";for(var j=0;j<w;j++){var v=x[j]==null?"":x[j];c+=(i?'<td>':'<th>')+esc(v)+(i?'</td>':'</th>')}return '<tr>'+c+'</tr>'}).join("")+'</table></div>'}
function pick(f){if(!f)return;S.err="";
 f.arrayBuffer().then(function(buf){S.file=f;S.buf=buf;return PDFX.openPdf(buf.slice(0))}).then(function(doc){S.doc=doc;S.pages=doc.numPages;
  var n=Math.min(3,doc.numPages),ps=[];for(var i=1;i<=n;i++)ps.push(PDFX.pageItems(doc,i));
  return Promise.all(ps)}).then(function(arr){var ch=0;arr.forEach(function(a){a.forEach(function(it){ch+=it.s.trim().length})});S.kind=ch>=20*arr.length?"digital":"scan";S.st="ready";S.mode="auto";S.sheets=[];view()})
 .catch(function(){S.st="idle";S.err=T("تعذّرت قراءة الملف. هل هو PDF سليم؟","Could not read the file. Is it a valid PDF?");view()})}
function convert(){S.st="busy";S.pct=0;S.cur=1;S.sheets=[];view();var i=1;
 (function next(){if(i>S.pages){S.st="done";view();return}
  S.cur=i;PDFX.pageItems(S.doc,i).then(function(it){var rows=PDFX.tableFromItems(it);S.sheets.push({name:"Page "+i,rows:rows});S.pct=Math.round(i/S.pages*100);i++;view();setTimeout(next,0)}).catch(function(){S.sheets.push({name:"Page "+i,rows:[]});i++;setTimeout(next,0)})})()}
function download(){var sh=S.sheets.filter(function(x){return x.rows.length});if(!sh.length)sh=[{name:"Page 1",rows:[[""]]}];
 var b=PDFX.writeXlsx(sh),a=document.createElement("a"),nm=S.file.name.replace(/\.pdf$/i,"")+".xlsx";a.href=URL.createObjectURL(b);a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
$("fi").addEventListener("change",function(){pick($("fi").files[0])});
view();
</script>
</body>
</html>
