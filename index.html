<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1a16">
<title>Top Manage</title>
<style>
:root{--bg:#0f1a16;--bg2:#15241e;--card:#1a2d25;--line:#294237;--ink:#eaf2ee;--muted:#9bb2a7;--g:#4cc38a;--g2:#2f9e6b;--sand:#d9b66e}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Naskh Arabic",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 85% -10%,rgba(76,195,138,.16),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(217,182,110,.1),transparent 60%),var(--bg);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;background:rgba(15,26,22,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar>div{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;direction:ltr}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--g),var(--g2));color:#06150e;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.search{margin-inline-start:auto;flex:0 1 280px;width:100%}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:.95rem;font-family:inherit;outline:none}
.search input:focus{border-color:var(--g)}
.search input::placeholder{color:#6f877b}
.lang{flex:0 0 auto;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:.9rem;font-family:inherit;cursor:pointer}
.lang:hover{border-color:var(--g)}
main{max-width:1040px;margin:0 auto;padding:36px 20px 56px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.3;direction:ltr;text-align:start}
html[dir=rtl] .hero h1{text-align:right}
.hero p{color:var(--muted);margin-top:10px;line-height:1.9;max-width:640px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:.85rem;color:var(--g);background:rgba(76,195,138,.12);border:1px solid rgba(76,195,138,.3);padding:6px 12px;border-radius:999px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
h2{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:38px 0 14px}
html[dir=rtl] h2{letter-spacing:0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.app{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:20px;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
.app:hover,.app:focus-visible{transform:translateY(-3px);border-color:var(--g);box-shadow:0 14px 34px rgba(0,0,0,.35);outline:none}
.ico{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:linear-gradient(135deg,rgba(76,195,138,.25),rgba(76,195,138,.08));border:1px solid rgba(76,195,138,.35)}
.ico svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app b{font-size:1.08rem;line-height:1.5}
.app .t{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
html[dir=rtl] .app .t{letter-spacing:0;font-size:.82rem}
.app p{color:var(--muted);font-size:.92rem;line-height:1.8}
.app .go{margin-top:auto;color:var(--g);font-weight:600;font-size:.92rem}
.soon{opacity:.55;border-style:dashed;pointer-events:none;background:transparent}
.soon .ico{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.empty{display:none;color:var(--muted);padding:24px 0}
footer{max-width:1040px;margin:0 auto;padding:0 20px 36px;color:#6f877b;font-size:.85rem;line-height:1.7}
@media(max-width:560px){.bar>div{flex-wrap:wrap}.search{flex:1 1 100%;order:3;margin-inline-start:0}.lang{margin-inline-start:auto}main{padding-top:26px}.grid{grid-template-columns:1fr}.app{flex-direction:row;flex-wrap:wrap;align-items:center}.app .ico{width:48px;height:48px;flex:0 0 48px}.app>div{flex:1;min-width:0}.app p,.app .go{flex:1 1 100%}}
</style>
</head>
<body>
<div class="bar"><div>
<div class="logo"><i>TM</i>Top Manage</div>
<button class="lang" id="lang" type="button">English</button>
<div class="search"><input id="q" type="search" autocomplete="off"></div>
</div></div>
<main>
<section class="hero">
<h1>Top Manage</h1>
<p id="intro"></p>
<span class="badge" id="badge"></span>
</section>
<h2 id="tools-h"></h2>
<div class="grid" id="grid"></div>
<div class="empty" id="empty"></div>
</main>
<footer id="foot"></footer>
<script>
/* To add a tool: add one entry to TOOLS with its texts in both languages. Nothing else to change. */
var UI={
 ar:{dir:"rtl",toggle:"English",search:"ابحث عن أداة",
  intro:"صندوق أدوات خاص بأعمال الأنابيب وحزم الاختبار. اختر أداة لفتحها. تعمل جميع الأدوات داخل المتصفح على جهازك، ولا يُرفع أي ملف إلى أي جهة.",
  badge:"يعمل دون اتصال بالإنترنت",tools:"الأدوات",open:"افتح ←",
  empty:"لا توجد أداة مطابقة لبحثك.",foot:"لا يحتوي هذا المستودع على أي بيانات مشروع."},
 en:{dir:"ltr",toggle:"العربية",search:"Search tools",
  intro:"Your piping and test-pack toolbox. Pick a tool to open it. Everything runs in your browser on your device, no files are uploaded.",
  badge:"Works offline",tools:"Tools",open:"Open \u2192",
  empty:"No tool matches your search.",foot:"No project data is stored in this repository."}
};
var TOOLS=[
 {href:"TP_selectionset_tool.html",
  icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>',
  ar:{tag:"نافيسووركس",name:"منشئ مجموعات التحديد",desc:"يحوّل قائمة الخطوط من ملف إكسل (رقم الخط ورقم حزمة الاختبار) إلى ملف مجموعات تحديد لبرنامج نافيسووركس."},
  en:{tag:"Navisworks",name:"Selection Set Builder",desc:"Turns an Excel line list (line number and test pack number) into a Navisworks selection-set XML."}},
 {href:"TP_monitor_tool_no_index.html",
  icon:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  ar:{tag:"المتابعة",name:"متابع حزم الاختبار",desc:"ينشئ ملف متابعة لحزم الاختبار من ملفات تفريغ السبول وتفريغ اللحامات."},
  en:{tag:"Monitoring",name:"Test Pack Monitor",desc:"Builds a test-pack monitor from spool dump and weld dump files."}},
 {soon:true,icon:"+",
  ar:{tag:"قريبًا",name:"المزيد من الأدوات قريبًا",desc:"ستظهر الأدوات الجديدة هنا."},
  en:{tag:"Soon",name:"More tools coming",desc:"New tools will appear here."}}
];
var L="ar";try{L=localStorage.getItem("tm-lang")||"ar"}catch(e){}
if(!UI[L])L="ar";
var grid=document.getElementById("grid"),q=document.getElementById("q"),empty=document.getElementById("empty");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var u=UI[L],f=q.value.trim().toLowerCase(),n=0,h="";
 TOOLS.forEach(function(t){
  var x=t[L],hay=(x.name+" "+x.tag+" "+x.desc).toLowerCase();
  if(f&&(t.soon||hay.indexOf(f)<0))return;
  n++;
  var tag=t.soon?"div":"a";
  h+='<'+tag+(t.soon?'':' href="'+esc(t.href)+'"')+' class="app'+(t.soon?' soon':'')+'"><div class="ico">'+t.icon+'</div><div><span class="t">'+esc(x.tag)+'</span><br><b>'+esc(x.name)+'</b></div><p>'+esc(x.desc)+'</p>'+(t.soon?'':'<span class="go">'+u.open+'</span>')+'</'+tag+'>';
 });
 grid.innerHTML=h;empty.style.display=n?"none":"block";
}
function apply(){
 var u=UI[L],d=document.documentElement;
 d.lang=L;d.dir=u.dir;
 document.getElementById("lang").textContent=u.toggle;
 q.placeholder=u.search;q.setAttribute("aria-label",u.search);
 document.getElementById("intro").textContent=u.intro;
 document.getElementById("badge").textContent=u.badge;
 document.getElementById("tools-h").textContent=u.tools;
 empty.textContent=u.empty;
 document.getElementById("foot").textContent=u.foot;
 render();
}
document.getElementById("lang").addEventListener("click",function(){L=L==="ar"?"en":"ar";try{localStorage.setItem("tm-lang",L)}catch(e){}apply()});
q.addEventListener("input",render);
apply();
</script>
</body>
</html>
