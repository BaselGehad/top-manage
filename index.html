<title>Top Manage</title>
<link rel="stylesheet" href="tm.css?v=24">
<style>
.search{flex:0 1 260px;width:100%}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:.95rem;font-family:inherit;outline:none}
.search input:focus{border-color:var(--g)}
.search input::placeholder{color:var(--muted)}
main.home{max-width:1040px;margin:0 auto;padding:36px 20px 56px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.3;direction:ltr;text-align:start}
html[dir=rtl] .hero h1{text-align:right}
.hero p{color:var(--muted);margin-top:10px;line-height:1.9;max-width:640px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:.85rem;color:var(--g);background:var(--over);border:1px solid var(--g2);padding:6px 12px;border-radius:999px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
h2{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:38px 0 14px}
html[dir=rtl] h2{letter-spacing:0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.app{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:20px;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
.app:hover,.app:focus-visible{transform:translateY(-3px);border-color:var(--g);box-shadow:0 14px 34px var(--shadow);outline:none}
.ico{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:linear-gradient(135deg,var(--over),transparent);border:1px solid var(--g2)}
.ico svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app b{font-size:1.08rem;line-height:1.5}
.app .t{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
html[dir=rtl] .app .t{letter-spacing:0;font-size:.82rem}
.app p{color:var(--muted);font-size:.92rem;line-height:1.8}
.app .go{margin-top:auto;color:var(--g);font-weight:600;font-size:.92rem}
.soon{opacity:.55;border-style:dashed;pointer-events:none;background:transparent}
.soon .ico{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.secs{display:grid;gap:18px;margin-top:30px}
.sec{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 12px 30px -16px var(--shadow)}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--g),var(--g2))}
.sec-ico svg{width:22px;height:22px;stroke:var(--accink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sec-h h3{font-size:1.2rem;direction:ltr;margin:0}
.sec-h .cnt{margin-inline-start:auto;font-size:.8rem;color:var(--g);background:var(--over);border:1px solid var(--g2);border-radius:999px;padding:2px 10px}
.sec .app{background:var(--bg)}
.sec-h{cursor:pointer;margin-bottom:0}
.sec.open .sec-h{margin-bottom:16px}
.sec .grid{display:none}
.sec.open .grid{display:grid}
.sec .vsw{display:none}
.sec.open .vsw{display:flex}
.chev{display:flex;color:var(--muted)}
.chev svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sec.open .chev svg{transform:rotate(180deg)}
.sec-h .cnt{margin-inline-start:auto}
.vsw{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.vsw button{padding:0;width:32px;height:30px;border:0;border-radius:9px;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.vsw button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vsw button.on{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--accink)}
.grid.v-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.grid.v-grid .app{flex-direction:column;align-items:center;text-align:center;padding:18px 10px;gap:10px}
.grid.v-grid .app p,.grid.v-grid .app .go,.grid.v-grid .app .t{display:none}
.grid.v-grid .app>div:nth-child(2){flex:0 0 auto;text-align:center}
.grid.v-grid .app b{font-size:.95rem}
.grid.v-list{grid-template-columns:1fr;gap:8px}
.grid.v-list .app{flex-direction:row;flex-wrap:nowrap;align-items:center;padding:10px 14px;gap:12px;border-radius:16px}
.grid.v-list .app .ico{width:40px;height:40px;flex:0 0 40px;border-radius:12px}
.grid.v-list .app p,.grid.v-list .app .go{display:none}
.grid.v-list .app>div:nth-child(2){flex:1;min-width:0}
.grid.v-list .app:after{content:"\203A";color:var(--g);font-size:1.4rem;line-height:1}
html[dir=rtl] .grid.v-list .app:after{content:"\2039"}
.empty{display:none;color:var(--muted);padding:24px 0}
footer{max-width:1040px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:.85rem;line-height:1.7}
@media(max-width:560px){main.home{padding-top:26px}.grid{grid-template-columns:1fr}.app{flex-direction:row;flex-wrap:wrap;align-items:center}.app .ico{width:48px;height:48px;flex:0 0 48px}.app>div{flex:1;min-width:0}.app p,.app .go{flex:1 1 100%}}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.hero .acts .chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 14px;border-radius:12px;font-size:.88rem;background:var(--over);border:1px solid var(--g2);color:var(--g);line-height:1}
html[dir=rtl] .hero .acts .chip{padding:0 14px 0 6px}
.hero .acts .chip svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}
.hero .acts .chip b{min-width:26px;height:26px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--g),var(--g2));color:var(--accink);font-size:.85rem}
.hero .acts .chip.zero{background:var(--chip);border-color:var(--line);color:var(--muted);padding:0 14px}
.hero .acts .chip.err{height:auto;padding:8px 12px;line-height:1.5;color:var(--err);background:transparent;border-color:var(--err)}
.hero .acts .tm-btn{height:40px}
.dm table{margin-top:10px}
.dm td.act{white-space:nowrap;text-align:end}
.dm td.act button{padding:6px 12px;font-size:.85rem;margin-inline-start:6px}
.dm .none{color:var(--muted);padding:18px 0}
.dm .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.back{margin-top:6px}
.soon-box{margin-top:22px;border:1px dashed var(--line);border-radius:24px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.soon-box p{margin:0}
#dm-list{overflow-x:auto;max-width:100%}
#dm-list table{min-width:0}
@media(max-width:560px){#dm-list th:nth-child(3),#dm-list td:nth-child(3){display:none}#dm-list td.act{white-space:normal}#dm-list td.act button{margin:2px}#dm-list td.l{overflow-wrap:anywhere}}
.req{margin-top:18px;border:1px solid var(--line);border-radius:20px;padding:14px 16px;background:linear-gradient(180deg,var(--card),var(--bg2))}
.req-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.req-h b{font-size:1.02rem}
.area{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.area input{width:92px!important;padding:6px 10px;font-size:.95rem;text-align:center;direction:ltr;text-transform:uppercase}
.req-hint{margin:8px 0 10px;font-size:.85rem;color:var(--muted)}
.rq{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rq i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.rq i svg{width:14px;height:14px;stroke:var(--accink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.rq.over{background:var(--over);outline:2px dashed var(--g);outline-offset:-2px;border-radius:12px}
.rq:not(.ok) em{display:flex;align-items:center;gap:4px;color:var(--g)}
.rq em svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rq small{display:block;font-weight:400;font-size:.75rem;color:var(--muted);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.rq.ok i{background:linear-gradient(135deg,var(--g),var(--g2));border-color:transparent}
.rq.ok i svg{display:block}
.rq span{flex:1;direction:ltr;text-align:start;font-weight:600}
.rq em{font-style:normal;font-size:.8rem;color:var(--muted)}
.rq.ok em{color:var(--g)}
#sr{padding-top:18px}
.sr-h{font-size:.8rem;color:var(--muted);margin:18px 2px 8px;letter-spacing:.3px}
.sr-app{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--card),var(--bg2));margin-bottom:8px;cursor:pointer;text-decoration:none;color:inherit}

.sr-app .sec-ico svg{width:20px;height:20px}

.sr-app small{color:var(--muted)}
.sr-g{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--card),var(--bg2));margin-bottom:12px;overflow:hidden}
.sr-gh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;direction:ltr}
.sr-gh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-gh em{font-style:normal;color:var(--g);background:var(--over);border:1px solid var(--g2);border-radius:999px;padding:1px 9px;font-size:.78rem}
.sr-r{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;direction:ltr;text-align:start}
.sr-gh+.sr-r{border-top:0}
.sr-r .rn{font-size:.72rem;color:var(--muted)}
.sr-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sr-c span{font-size:.85rem;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.sr-c span i{font-style:normal;color:var(--muted);font-size:.72rem;margin-inline-end:4px}
.sr-c span.hit{border-color:var(--g);background:var(--over)}
.sr-c span.hit b{color:var(--g)}
.sr-r:not(.open) .sr-c span:not(.hit):nth-child(n+4){display:none}
.sr-more{padding:8px 14px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
.sr-st{color:var(--muted);padding:20px 4px;text-align:center}
a.navc{display:block;text-decoration:none;color:inherit}
a.navc .chev svg{transform:rotate(-90deg)}
.sec-h .cnt.zero{color:var(--muted);border-color:var(--line);background:none}
html[dir=rtl] a.navc .chev svg{transform:rotate(90deg)}
#tgrid .sec .grid{display:grid}#tgrid .sec .vsw{display:flex}#tgrid .sec-h{cursor:default;margin-bottom:16px}
.dm .sz{direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.tm-bar .search{position:relative;display:flex;align-items:center;flex:0 1 260px;width:100%}
.tm-bar .search input{padding-inline-start:40px}
.tm-bar .search #sbtn{position:absolute;inset-inline-start:0;border:0;background:none;pointer-events:none}
.tm-bar .search #sx{display:none}
@media(max-width:700px){
 .tm-bar .search{flex:0 0 auto;width:auto}

 .tm-bar .search #sbtn{position:static;border:1px solid var(--line);background:var(--bg2);pointer-events:auto}
 .tm-bar.srch-open .tm-nm,.tm-bar.srch-open #lang,.tm-bar.srch-open #tm-theme-btn{display:none}
 .tm-bar.srch-open .tm-slot{flex:1}

 .tm-bar.srch-open .search input{display:block;flex:1;min-width:0;padding-inline-start:14px}
 .tm-bar.srch-open .search #sbtn{display:none}
 .tm-bar.srch-open .search #sx{display:flex;margin-inline-start:8px}
}
