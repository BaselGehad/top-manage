<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1a16">
<script src="tm.js?v=9"></script>
<title>Top Manage</title>
<link rel="stylesheet" href="tm.css?v=9">
<style>
.search{flex:0 1 260px;width:100%}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:.95rem;font-family:inherit;outline:none}
.search input:focus{border-color:var(--g)}
.search input::placeholder{color:var(--muted)}
main.home{max-width:1040px;margin:0 auto;padding:36px 20px 56px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.3;direction:ltr;text-align:start}
html[dir=rtl] .hero h1{text-align:right}
.hero p{color:var(--muted);margin-top:10px;line-height:1.9;max-width:640px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:.85rem;color:var(--g);background:var(--over);border:1px solid var(--g2);padding:6px 12px;border-radius:999px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
h2{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:38px 0 14px}
html[dir=rtl] h2{letter-spacing:0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.app{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:20px;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
.app:hover,.app:focus-visible{transform:translateY(-3px);border-color:var(--g);box-shadow:0 14px 34px var(--shadow);outline:none}
.ico{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:linear-gradient(135deg,var(--over),transparent);border:1px solid var(--g2)}
.ico svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app b{font-size:1.08rem;line-height:1.5}
.app .t{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
html[dir=rtl] .app .t{letter-spacing:0;font-size:.82rem}
.app p{color:var(--muted);font-size:.92rem;line-height:1.8}
.app .go{margin-top:auto;color:var(--g);font-weight:600;font-size:.92rem}
.soon{opacity:.55;border-style:dashed;pointer-events:none;background:transparent}
.soon .ico{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted)}
.empty{display:none;color:var(--muted);padding:24px 0}
footer{max-width:1040px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:.85rem;line-height:1.7}
@media(max-width:560px){main.home{padding-top:26px}.grid{grid-template-columns:1fr}.app{flex-direction:row;flex-wrap:wrap;align-items:center}.app .ico{width:48px;height:48px;flex:0 0 48px}.app>div{flex:1;min-width:0}.app p,.app .go{flex:1 1 100%}}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.dm table{margin-top:10px}
.dm td.act{white-space:nowrap;text-align:end}
.dm td.act button{padding:6px 12px;font-size:.85rem;margin-inline-start:6px}
.dm .none{color:var(--muted);padding:18px 0}
.dm .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.back{margin-top:6px}
.dm .sz{direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.tm-bar .search{position:relative;display:flex;align-items:center;flex:0 1 260px;width:100%}
.tm-bar .search input{padding-inline-start:40px}
.tm-bar .search #sbtn{position:absolute;inset-inline-start:0;border:0;background:none;pointer-events:none}
.tm-bar .search #sx{display:none}
@media(max-width:700px){
 .tm-bar .search{flex:0 0 auto;width:auto}
 .tm-bar .search input{display:none}
 .tm-bar .search #sbtn{position:static;border:1px solid var(--line);background:var(--bg2);pointer-events:auto}
 .tm-bar.srch-open .tm-nm,.tm-bar.srch-open #lang,.tm-bar.srch-open #tm-theme-btn{display:none}
 .tm-bar.srch-open .tm-slot{flex:1}
 .tm-bar.srch-open .search{flex:1;width:100%}
 .tm-bar.srch-open .search input{display:block;flex:1;min-width:0;padding-inline-start:14px}
 .tm-bar.srch-open .search #sbtn{display:none}
 .tm-bar.srch-open .search #sx{display:flex;margin-inline-start:8px}
}
</style>
</head>
<body>
<main class="home" id="home">
<section class="hero">
<h1>Top Manage</h1>
<p id="intro"></p>
<span class="badge" id="badge"></span>
<div class="acts"><button class="tm-btn" id="btnData" type="button"></button><span class="chip" id="stat"></span></div>
</section>
<h2 id="tools-h"></h2>
<div class="grid" id="grid"></div>
<div class="empty" id="empty"></div>
</main>
<main class="home dm hidden" id="dm">
<button class="tm-btn back" id="btnBack" type="button"></button>
<h1 id="dm-h" style="margin-top:18px"></h1>
<p class="sub" id="dm-p"></p>
<div class="top"><button class="pri" id="btnAdd" type="button"></button><button id="btnClearAll" type="button"></button></div>
<input id="fileAdd" type="file" multiple accept=".xlsx,.xlsb,.csv,.part1,.part2,.part3,.part4,.part5,.part6,.part7,.part8,.part9,application/octet-stream" class="hidden">
<input id="fileRep" type="file" class="hidden">
<div class="card" id="dm-list"></div>
<p class="note err" id="dm-err"></p>
<p class="note" id="dm-note"></p>
</main>
<footer id="foot"></footer>
<script>
/* To add a tool: add one entry to TOOLS with its texts in both languages. Nothing else to change. */
var UI={
 ar:{dir:"rtl",toggle:"English",search:"ابحث عن أداة",
  intro:"أدوات الأنابيب وحزم الاختبار. تعمل على جهازك دون اتصال.",
  badge:"يعمل دون اتصال بالإنترنت",
  data:"رفع ملفات البيانات",dmH:"مدير البيانات",back:"→ الرئيسية",
  dmP:"ارفع الجداول مرة واحدة، وتقرؤها الأدوات تلقائيًا.",
  add:"إضافة ملفات",clearAll:"حذف الكل",colName:"الملف",colSize:"الحجم",colAdded:"تاريخ الإضافة",replace:"استبدال",remove:"حذف",
  none:"لا توجد ملفات.",confirmClear:"حذف جميع الملفات المحفوظة؟",confirmRm:"حذف هذا الملف؟",
  dmNote:"تُحفظ الملفات على هذا الجهاز فقط.",
  stored:"المحفوظ:",files:"ملفات",statNone:"لا توجد ملفات محفوظة",statN:"ملفات محفوظة على هذا الجهاز: ",saveErr:"تعذّر الحفظ. افتح الموقع في كروم خارج التصفح الخفي وأعد المحاولة.",noPersist:"قد يحذف المتصفح الملفات عند امتلاء التخزين.",tools:"الأدوات",open:"افتح ←",
  empty:"لا توجد أداة مطابقة لبحثك.",foot:"لا يحتوي هذا المستودع على أي بيانات مشروع."},
 en:{dir:"ltr",toggle:"العربية",search:"Search tools",
  intro:"Piping and test-pack tools. Works on your device, offline.",
  badge:"Works offline",
  data:"Upload data files",dmH:"Data manager",back:"\u2190 Home",
  dmP:"Upload sheets once. Tools read them automatically.",
  add:"Add files",clearAll:"Remove all",colName:"File",colSize:"Size",colAdded:"Added",replace:"Replace",remove:"Remove",
  none:"No files.",confirmClear:"Remove all stored files?",confirmRm:"Remove this file?",
  dmNote:"Files stay on this device only.",
  stored:"Stored:",files:"files",statNone:"No stored files",statN:"Files stored on this device: ",saveErr:"Could not save. Open the site in Chrome, outside private mode, and retry.",noPersist:"The browser may delete files when storage is low.",tools:"Tools",open:"Open \u2192",
  empty:"No tool matches your search.",foot:"No project data is stored in this repository."}
};
var TOOLS=[
 {href:"TP_selectionset_tool.html",
  icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>',
  ar:{tag:"نافيسووركس",name:"منشئ مجموعات التحديد",desc:"ملف مجموعات تحديد من رقم الدائرة أو من ملف إكسل."},
  en:{tag:"Navisworks",name:"Selection Set Builder",desc:"Selection-set XML from a test pack number or an Excel sheet."}},
 {href:"TP_monitor_tool_no_index.html",
  icon:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
  ar:{tag:"المتابعة",name:"متابع حزم الاختبار",desc:"ملف متابعة لحزمة الاختبار."},
  en:{tag:"Monitoring",name:"Test Pack Monitor",desc:"Test-pack monitor file."}},
 {soon:true,icon:"+",
  ar:{tag:"قريبًا",name:"المزيد من الأدوات قريبًا",desc:"ستظهر هنا."},
  en:{tag:"Soon",name:"More tools coming",desc:"Coming here."}}
];
var L="ar";try{L=localStorage.getItem("tm-lang")||"ar"}catch(e){}
if(!UI[L])L="ar";
var bar=TM.bar({home:"index.html"});
document.getElementById("tm-slot").innerHTML='<div class="search" id="srch"><button class="tm-btn tm-ic" id="sbtn" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><input id="q" type="search" autocomplete="off"><button class="tm-btn tm-ic" id="sx" type="button" aria-label="x"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><button class="tm-btn tm-ic wide" id="lang" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langt"></span></button>';
document.getElementById("sbtn").onclick=function(){bar.classList.add("srch-open");q.focus()};
document.getElementById("sx").onclick=function(){q.value="";render();bar.classList.remove("srch-open")};
var grid=document.getElementById("grid"),q=document.getElementById("q"),empty=document.getElementById("empty");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var u=UI[L],f=q.value.trim().toLowerCase(),n=0,h="";
 TOOLS.forEach(function(t){
  var x=t[L],hay=(x.name+" "+x.tag+" "+x.desc).toLowerCase();
  if(f&&(t.soon||hay.indexOf(f)<0))return;
  n++;
  var tag=t.soon?"div":"a";
  h+='<'+tag+(t.soon?'':' href="'+esc(t.href)+'"')+' class="app'+(t.soon?' soon':'')+'"><div class="ico">'+t.icon+'</div><div><span class="t">'+esc(x.tag)+'</span><br><b>'+esc(x.name)+'</b></div><p>'+esc(x.desc)+'</p>'+(t.soon?'':'<span class="go">'+u.open+'</span>')+'</'+tag+'>';
 });
 grid.innerHTML=h;empty.style.display=n?"none":"block";
}
function apply(){
 var u=UI[L],d=document.documentElement;
 d.lang=L;d.dir=u.dir;
 document.getElementById("langt").textContent=L==="ar"?"EN":"ع";document.getElementById("lang").title=u.toggle;document.getElementById("lang").setAttribute("aria-label",u.toggle);dmText();
 q.placeholder=u.search;q.setAttribute("aria-label",u.search);
 document.getElementById("intro").textContent=u.intro;
 document.getElementById("badge").textContent=u.badge;
 document.getElementById("tools-h").textContent=u.tools;
 empty.textContent=u.empty;
 document.getElementById("foot").textContent=u.foot;
 render();
}
document.getElementById("lang").addEventListener("click",function(){L=L==="ar"?"en":"ar";try{localStorage.setItem("tm-lang",L)}catch(e){}apply()});
q.addEventListener("input",render);

var S=TM.store,$=function(i){return document.getElementById(i)};
function dmText(){var u=UI[L];stat();$("btnData").textContent=u.data;$("btnBack").textContent=u.back;$("dm-h").textContent=u.dmH;$("dm-p").textContent=u.dmP;$("btnAdd").textContent=u.add;$("btnClearAll").textContent=u.clearAll;$("dm-note").textContent=u.dmNote;if(!$("dm").classList.contains("hidden"))dmList()}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function fmtDate(t){try{return new Date(t).toLocaleString(L==="ar"?"ar-EG-u-nu-latn":"en-GB",{dateStyle:"medium",timeStyle:"short"})}catch(e){return new Date(t).toISOString().slice(0,16).replace("T"," ")}}
var repName=null;
function stat(){S.list().then(function(a){$("stat").textContent=a.length?UI[L].statN+a.length:UI[L].statNone;$("stat").className="chip"}).catch(function(){$("stat").textContent=UI[L].saveErr;$("stat").className="chip err"})}
function showErr(m){$("dm-err").textContent=m||""}
function dmList(){
 var u=UI[L];stat();
 S.list().then(function(a){
  if(!a.length){$("dm-list").innerHTML='<div class="none">'+esc(u.none)+'</div>';return}
  var h='<table><thead><tr><th>'+u.colName+'</th><th>'+u.colSize+'</th><th>'+u.colAdded+'</th><th></th></tr></thead><tbody>';
  a.forEach(function(f,i){h+='<tr><td class="l">'+esc(f.name)+'</td><td class="sz">'+fmtSize(f.size)+'</td><td>'+esc(fmtDate(f.added))+'</td><td class="act"><button data-r="'+i+'" type="button">'+u.replace+'</button><button data-d="'+i+'" type="button">'+u.remove+'</button></td></tr>'});
  $("dm-list").innerHTML=h+'</tbody></table>';
  $("dm-list").querySelectorAll("button").forEach(function(b){b.onclick=function(){
   if(b.dataset.r!==undefined){repName=a[+b.dataset.r].name;$("fileRep").click()}
   else if(confirm(u.confirmRm))S.remove(a[+b.dataset.d].name).then(dmList)}});
 });
}
function showDm(on){$("home").classList.toggle("hidden",on);$("dm").classList.toggle("hidden",!on);if(on){dmList();S.persist()}if(location.hash!==(on?"#data":""))history.replaceState(null,"",on?"#data":location.pathname+location.search);window.scrollTo(0,0)}
$("btnData").onclick=function(){showDm(true);$("fileAdd").click()};
$("btnBack").onclick=function(){showDm(false)};
$("btnAdd").onclick=function(){$("fileAdd").click()};
$("fileAdd").onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value="";showErr("");Promise.all(fs.map(function(f){return S.put(f)})).then(function(){return S.persist()}).then(function(p){if(p===false)showErr(UI[L].noPersist)}).catch(function(){showErr(UI[L].saveErr)}).then(dmList)};
$("fileRep").onchange=function(e){var f=e.target.files[0];e.target.value="";if(!f||!repName)return;var old=repName;repName=null;showErr("");S.put(f).then(function(){return f.name===old?0:S.remove(old)}).catch(function(){showErr(UI[L].saveErr)}).then(dmList)};
$("btnClearAll").onclick=function(){if(confirm(UI[L].confirmClear))S.clear().then(dmList)};
S.onchange(function(){if(!$("dm").classList.contains("hidden"))dmList()});
stat();
if(location.hash==="#data")showDm(true);
apply();
</script>
</body>
</html>
