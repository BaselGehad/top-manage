<script>
"use strict";
(function(){
const UTF8 = new TextDecoder("utf-8");
const sleep0 = () => new Promise(r => setTimeout(r, 0));
function colIdx(ref) { let n = 0; for (let i = 0; i < ref.length; i++) { const c = ref.charCodeAt(i); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n - 1; }

const norm = s => String(s == null ? "" : s).trim();
const lowKey = s => norm(s).toLowerCase();

/* ================= zip (Blob based, streaming) ================= */
async function openZip(blob) {
  const size = blob.size;
  const tailLen = Math.min(size, 65557);
  const tail = new DataView(await blob.slice(size - tailLen, size).arrayBuffer());
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error(TM.tt("الملف ليس بصيغة zip/xlsx/xlsb صحيحة","Not a valid zip/xlsx/xlsb file"));
  const count = tail.getUint16(eocd + 10, true);
  const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  if (cdOff === 0xFFFFFFFF || cdSize === 0xFFFFFFFF) throw new Error(TM.tt("zip64 غير مدعوم","zip64 is not supported"));
  const cd = new DataView(await blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const u8 = new Uint8Array(cd.buffer);
  const entries = {}; let p = 0;
  for (let n = 0; n < count; n++) {
    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error(TM.tt("ملف zip تالف","Corrupt zip file"));
    const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true);
    const nl = cd.getUint16(p + 28, true), el = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
    const lho = cd.getUint32(p + 42, true);

    p += 46 + nl + el + cl;
  }

    const e = entries[name]; if (!e) return null;
    const lh = new DataView(await blob.slice(e.lho, e.lho + 30).arrayBuffer());
    const start = e.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const s = blob.slice(start, start + e.csize).stream();

  }
  async function bytes(name) { const s = await stream(name); return s ? new Uint8Array(await new Response(s).arrayBuffer()) : null; }
  async function text(name) { const b = await bytes(name); return b ? UTF8.decode(b) : null; }
  return { has: n => n in entries, names: () => Object.keys(entries), stream, bytes, text };
}

/* ================= XLSB records ================= */
async function recordStream(stream, cb) {
  const reader = stream.getReader();
  let buf = new Uint8Array(0), stop = false;
  while (!stop) {
    const { done, value } = await reader.read();
    if (done) break;
    if (buf.length) { const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb; } else buf = value;
    let p = 0; const L = buf.length;
    while (p < L) {
      let q = p; const b1 = buf[q++]; let id = b1;
      if (b1 & 0x80) { if (q >= L) break; id = (b1 & 0x7f) | (buf[q++] << 7); }

      for (let i = 0; i < 4; i++) { if (q >= L) break; const b = buf[q++]; size |= (b & 0x7f) << shift; shift += 7; if (!(b & 0x80)) { ok = true; break; } }
      if (!ok || q + size > L) break;
      if (cb(id, buf, q, size) === true) { stop = true; break; }
      p = q + size;
    }
    buf = p >= L ? new Uint8Array(0) : buf.slice(p);
  }

}
function wideStr(buf, off) { const dv = new DataView(buf.buffer, buf.byteOffset + off, 4); const n = dv.getUint32(0, true); let s = ""; const base = off + 4; if (n < 200) { for (let i = 0; i < n; i++) s += String.fromCharCode(buf[base + 2 * i] | (buf[base + 2 * i + 1] << 8)); return s; } return new TextDecoder("utf-16le").decode(buf.subarray(base, base + 2 * n)); }

function isDateFmtStr(f) { return /[dyhms]/i.test(f.replace(/"[^"]*"|\[[^\]]*\]|\\./g, "")); }
async function xlsbStyles(zip) {
  const dateXf = []; const fmts = {}; let inXf = false;
  const s = await zip.stream("xl/styles.bin"); if (!s) return dateXf;
  await recordStream(s, (id, buf, off, size) => {
    const dv = new DataView(buf.buffer, buf.byteOffset + off, size);
    if (id === 44) fmts[dv.getUint16(0, true)] = wideStr(buf, off + 2);
    else if (id === 617) inXf = true; else if (id === 618) inXf = false;
    else if (id === 47 && inXf) { const f = dv.getUint16(2, true); dateXf.push(BUILTIN_DATE.has(f) || (fmts[f] != null && isDateFmtStr(fmts[f]))); }
  });

}
async function xlsbSST(zip) {
  const out = []; const s = await zip.stream("xl/sharedStrings.bin"); if (!s) return out;
  await recordStream(s, (id, buf, off) => { if (id === 19) out.push(wideStr(buf, off + 1)); });

}

/* each reader calls onRow(rowIndex, cells[], dateCols[]) ; returning true stops */
async function readXlsb(blob, zip, onRow, sheetEntry) {
  const dateXf = await xlsbStyles(zip), sst = await xlsbSST(zip);
  const s = await zip.stream(sheetEntry);
  let cur = -1, cells = [], dates = [], stopped = false;
  const flush = () => { if (cur >= 0 && onRow(cur, cells, dates) === true) { stopped = true; } cells = []; dates = []; };
  await recordStream(s, (id, buf, off, size) => {
    if (id === 0) { flush(); if (stopped) return true; cur = new DataView(buf.buffer, buf.byteOffset + off, 4).getUint32(0, true); return false; }
    if (id < 1 || id > 11) return false;
    const dv = new DataView(buf.buffer, buf.byteOffset + off, size);
    const col = dv.getUint32(0, true), xf = dv.getUint32(4, true) & 0xFFFFFF;
    let v = null, isNum = false;
    switch (id) {
      case 2: v = decodeRK(dv.getUint32(8, true)); isNum = true; break;
      case 4: case 10: v = dv.getUint8(8) ? "TRUE" : "FALSE"; break;
      case 5: case 9: v = dv.getFloat64(8, true); isNum = true; break;
      case 6: case 8: v = wideStr(buf, off + 8); break;
      case 7: v = sst[dv.getUint32(8, true)]; if (v === undefined) v = null; break;
      default: v = null;
    }
    if (v === null) return false;
    cells[col] = v;
    if (isNum && dateXf[xf]) dates.push(col);
    return false;
  });

}

/* ================= XLSX streaming ================= */
async function readXlsx(blob, zip, onRow, sheetName) {
  const wbx = await zip.text("xl/workbook.xml");
  let target = "xl/worksheets/sheet1.xml";
  if (wbx) {
    const sheets = [...wbx.matchAll(/<sheet\b[^>]*>/g)].map(m => m[0]);
    let pick = sheets[0];
    if (sheetName) { const f = sheets.find(x => unesc((/name="([^"]*)"/.exec(x) || [])[1] || "") === sheetName); if (f) pick = f; }
    const rid = pick && (/r:id="([^"]*)"/.exec(pick) || [])[1];
    const rels = await zip.text("xl/_rels/workbook.xml.rels");
    if (rid && rels) { const m = [...rels.matchAll(/<Relationship\b[^>]*>/g)].map(x => x[0]).find(x => new RegExp('Id="' + rid + '"').test(x)); if (m) { const t = (/Target="([^"]*)"/.exec(m) || [])[1]; target = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""); } }
  }
  if (!zip.has(target)) throw new Error(TM.tt("الورقة غير موجودة في الملف","Sheet not found in file"));
  const sst = []; const sx = await zip.text("xl/sharedStrings.xml");
  if (sx) for (const m of sx.matchAll(/<si>([\s\S]*?)<\/si>|<si\/>/g)) { let t = ""; if (m[1]) { const body = m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, ""); for (const x of body.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)) t += x[1]; } sst.push(unesc(t)); }
  const dateXf = [];
  const st = await zip.text("xl/styles.xml");
  if (st) {
    const fm = {}; for (const m of st.matchAll(/<numFmt\b[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g)) fm[m[1]] = unesc(m[2]);
    const cx = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(st);
    if (cx) for (const m of cx[1].matchAll(/<xf\b[^>]*?numFmtId="(\d+)"/g)) { const f = +m[1]; dateXf.push(BUILTIN_DATE.has(f) || (fm[f] != null && isDateFmtStr(fm[f]))); }
  }
  const stream = await zip.stream(target);
  const reader = stream.getReader(); const td = new TextDecoder("utf-8");
  let acc = "", stop = false;
  const procRow = (rowXml, attrs) => {
    const rn = +((/\br="(\d+)"/.exec(attrs) || [])[1] || 0) - 1;
    const cells = [], dates = [];
    const re = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
    while ((m = re.exec(rowXml))) {
      if (m[2] == null) continue;
      const a = m[1]; const ref = (/\br="([A-Z]+)\d+"/.exec(a) || [])[1]; if (!ref) continue;
      const t = (/\bt="([^"]*)"/.exec(a) || [])[1]; const sIdx = +((/\bs="(\d+)"/.exec(a) || [])[1] || 0);
      const col = colIdx(ref); let v = null;
      if (t === "inlineStr") { let s = ""; for (const x of m[2].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)) s += x[1]; v = unesc(s); }
      else { const vm = /<v>([\s\S]*?)<\/v>/.exec(m[2]); if (!vm) continue; const raw = vm[1];
        if (t === "s") { v = sst[+raw]; if (v === undefined) v = null; }
        else if (t === "str" || t === "e") v = unesc(raw);
        else if (t === "b") v = raw === "1" ? "TRUE" : "FALSE";
        else { v = +raw; if (dateXf[sIdx]) dates.push(col); } }
      if (v === null) continue; cells[col] = v;
    }
    return onRow(rn, cells, dates) === true;
  };
  while (!stop) {
    const { done, value } = await reader.read();
    acc += td.decode(value || new Uint8Array(0), { stream: !done });
    let pos = 0, idx;
    while (!stop && (idx = acc.indexOf("</row>", pos)) >= 0) {
      const start = acc.lastIndexOf("<row", idx);
      if (start >= pos) { const hdrEnd = acc.indexOf(">", start); const attrs = acc.slice(start + 4, hdrEnd); if (acc[hdrEnd - 1] !== "/") { if (procRow(acc.slice(hdrEnd + 1, idx), attrs)) stop = true; } }
      pos = idx + 6;
    }
    acc = acc.slice(pos);
    if (done) break;
  }
  if (stop) { try { await reader.cancel(); } catch (e) {} }
}

/* ================= CSV streaming ================= */
async function readCsv(blob, onRow) {
  const reader = blob.stream().getReader(); const td = new TextDecoder("utf-8");
  let delim = null, row = [], field = "", inQ = false, rn = 0, first = true, stop = false, pendingQuote = false;
  const num = s => /^-?(0|[1-9]\d*)(\.\d+)?$/.test(s) ? +s : s;
  const endField = () => { row.push(row.length >= 0 ? field : field); field = ""; };
  const endRow = () => {
    endField(); const cells = [];
    for (let i = 0; i < row.length; i++) { const f = row[i]; if (f === "") continue; cells[i] = rn === 0 ? f : num(f); }
    row = []; const r = rn++; return onRow(r, cells, []) === true;
  };
  while (!stop) {
    const { done, value } = await reader.read();
    let s = td.decode(value || new Uint8Array(0), { stream: !done });
    if (first && s) { if (s.charCodeAt(0) === 0xFEFF) s = s.slice(1); first = false; const nl = s.search(/[\r\n]/); const h = nl < 0 ? s : s.slice(0, nl); const c = { ",": 0, ";": 0, "\t": 0 }; for (const ch of h) if (ch in c) c[ch]++; delim = Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; }
    for (let i = 0; i < s.length && !stop; i++) {
      const ch = s[i];
      if (pendingQuote) { pendingQuote = false; if (ch === '"') { field += '"'; continue; } inQ = false; }
      if (inQ) { if (ch === '"') pendingQuote = true; else field += ch; continue; }
      if (ch === '"' && field === "") inQ = true;
      else if (ch === delim) endField();
      else if (ch === "\n") { if (endRow()) stop = true; }
      else if (ch === "\r") { /* ignore */ }
      else field += ch;
    }
    if (done) { if (!stop && (field !== "" || row.length)) endRow(); break; }
  }
  if (stop) { try { await reader.cancel(); } catch (e) {} }
}

/* ================= unified reader ================= */
async function sniffKind(blob, name) {
  const head = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
  if (head[0] === 0x50 && head[1] === 0x4b) { const zip = await openZip(blob); const e = zip.names().find(n => /^xl\/worksheets\/sheet\d+\.(bin|xml)$/.test(n)); return { kind: /\.bin$/.test(e) ? "xlsb" : "xlsx", zip }; }

}
/* scan(blob, name, {sheetName, onHeader(header)->keep(cells)|null , peek}) */
async function scanTable(blob, name, opts, progress) {
  const sn = await sniffKind(blob, name);
  const header = []; let keep = null, rows = [], dateCols = [], seen = 0, gotHeader = false;
  const onRow = (r, cells, dates) => {
    if (!gotHeader) {
      if (!cells.length) return false;
      gotHeader = true; for (let i = 0; i < cells.length; i++) header[i] = norm(cells[i]);
      for (let i = 0; i < header.length; i++) if (header[i] === undefined) header[i] = "";
      if (opts.peek) return true;
      keep = opts.onHeader(header); return keep === null;
    }
    if (++seen % 20000 === 0 && progress) progress(seen);
    if (!cells.length) return false;
    if (keep(cells)) {
      const row = new Array(header.length);
      for (let i = 0; i < header.length; i++) row[i] = cells[i] === undefined ? null : cells[i];
      rows.push(row); for (const d of dates) dateCols[d] = true;
    }
    return false;
  };
  if (sn.kind === "xlsb") { const e = sn.zip.names().filter(n => /^xl\/worksheets\/sheet\d+\.bin$/.test(n)).sort()[0]; await readXlsb(blob, sn.zip, onRow, e); }

  else await readCsv(blob, onRow);
  return { kind: sn.kind, header, rows, dateCols, scanned: seen };
}
window.scanTable=scanTable; window.classifyHeader=function(header){const low=header.map(h=>h.toLowerCase());if(low.includes("spool length")||(low.includes("barcode number")&&low.includes("spool no.")))return "spool";return "other";};
})();

<script>
"use strict";
/* ---------- minimal XLSX reader (zip + inflate via built-in DecompressionStream; no network, no libraries) ---------- */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error(TM.tt("الملف ليس xlsx صحيحًا","Not a valid xlsx file"));
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder("utf-8");
  const entries = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error(TM.tt("ملف zip تالف","Corrupt zip file"));
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    entries[name] = { method, csize, lho };
    p += 46 + nlen + elen + clen;
  }
  return {
    has: n => n in entries,
    async text(name) {
      const e = entries[name];
      if (!e) return null;
      const lnl = dv.getUint16(e.lho + 26, true), lel = dv.getUint16(e.lho + 28, true);
      const start = e.lho + 30 + lnl + lel;
      const raw = u8.subarray(start, start + e.csize);
      const data = e.method === 0 ? raw : await inflateRaw(raw);
      return dec.decode(data);
    }
  };
}
function colIndex(ref) {
  const m = /^([A-Z]+)/.exec(ref); let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
async function readFirstSheet(buf) {
  const zip = await readZip(buf);
  const parse = s => new DOMParser().parseFromString(s, "application/xml");
  let sheetPath = "xl/worksheets/sheet1.xml";
  try {
    const wb = parse(await zip.text("xl/workbook.xml"));
    const rels = parse(await zip.text("xl/_rels/workbook.xml.rels"));
    const sh = wb.getElementsByTagName("sheet")[0];
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    for (const r of rels.getElementsByTagName("Relationship")) {
      if (r.getAttribute("Id") === rid) {
        let t = r.getAttribute("Target");
        sheetPath = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, "");
      }
    }
  } catch (e) { /* fall back to sheet1 */ }
  if (!zip.has(sheetPath)) throw new Error(TM.tt("الورقة غير موجودة في الملف","Sheet not found in file"));
  const shared = [];
  const ssText = await zip.text("xl/sharedStrings.xml");
  if (ssText) {
    for (const si of parse(ssText).getElementsByTagName("si")) {
      let s = ""; for (const t of si.getElementsByTagName("t")) s += t.textContent;
      shared.push(s);
    }
  }
  const sheet = parse(await zip.text(sheetPath));
  const rows = []; // {n: rowNumber, cells: []}
  for (const r of sheet.getElementsByTagName("row")) {
    const n = parseInt(r.getAttribute("r"), 10);
    const cells = [];
    for (const c of r.getElementsByTagName("c")) {
      const idx = colIndex(c.getAttribute("r"));
      const t = c.getAttribute("t");
      let v = "";
      if (t === "s") { const e = c.getElementsByTagName("v")[0]; v = e ? shared[parseInt(e.textContent, 10)] : ""; }
      else if (t === "inlineStr") { for (const x of c.getElementsByTagName("t")) v += x.textContent; }
      else { const e = c.getElementsByTagName("v")[0]; v = e ? e.textContent : ""; }
      cells[idx] = v;
    }
    rows.push({ n, cells });
  }
  return rows;
}

/* ---------- build selection sets ---------- */
function uuid() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const LINE_RE = /^[A-Za-z0-9]{2,6}-[A-Za-z0-9]+$/;
const CIRC_RE = /^\d{2}-[A-Za-z0-9]{4}-.+-PTJ-.*\d{5}-[A-Za-z]$/;

function analyze(rows) {
  const norm = s => String(s ?? "").trim();
  let lineCol = 0, circCol = 1, headerRow = -1;
  for (const r of rows) {
    const low = r.cells.map(c => norm(c).toLowerCase().replace(/[\s._]+/g, ""));
    const li = low.findIndex(x => x === "lineno" || x === "line" || x === "linenumber");
    const ci = low.findIndex(x => x === "testpackno" || x === "testpack" || x === "testpackno." || x === "circuit");
    if (li >= 0 && ci >= 0) { lineCol = li; circCol = ci; headerRow = r.n; break; }
  }
  const groups = new Map(); // circuit -> {rows:int, lines:Set}
  const blank = [], half = [], badLine = [], badCirc = [];
  let prev = headerRow >= 0 ? headerRow : rows[0].n;
  for (const r of rows) {
    if (r.n <= headerRow) continue;
    if (r.n > prev + 1) for (let k = prev + 1; k < r.n; k++) blank.push(k); // rows missing from the file = empty
    prev = r.n;
    if (headerRow < 0 && r.n === rows[0].n) continue; // assume first row is a header
    const l = norm(r.cells[lineCol]), c = norm(r.cells[circCol]);
    if (!l && !c) { blank.push(r.n); continue; }
    if (!l || !c) { half.push(r.n); continue; }
    if (!LINE_RE.test(l)) { badLine.push(r.n); continue; }
    let g = groups.get(c);
    if (!g) { g = { rows: 0, lines: new Set() }; groups.set(c, g); }
    g.rows++; g.lines.add(l);
    if (!CIRC_RE.test(c) && !badCirc.includes(c)) badCirc.push(c);
  }
  return { groups, blank, half, badLine, badCirc, headerRow, lineCol, circCol };
}
function ptj(c) { const m = /(\d{5})-[A-Za-z]$/.exec(c); return m ? m[1] : null; }
function fileNameFor(circuits) {
  const nums = circuits.map(ptj);
  if (nums.some(n => !n)) return "TP_selectionsets_OR.xml";
  const u = [...new Set(nums)].sort();
  return u.length === 1 ? `TP_${u[0]}_selectionset_OR.xml` : `TP_combined_${u.map(x => String(parseInt(x, 10))).join("_")}_OR.xml`;
}
function buildXml(groups) {
  const cond = v =>
`            <condition test="contains" flags="74">
              <category>
                <name internal="SP3D">SmartPlant 3D</name>
              </category>
              <property>
                <name internal="Test">System Path</name>
              </property>
              <value>
                <data type="wstring">${esc(v)}</data>
              </value>
            </condition>
`;
  let out = `<?xml version="1.0" encoding="UTF-8" ?>

<exchange xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://download.autodesk.com/us/navisworks/schemas/nw-exchange-12.0.xsd" units="m" filename="Model.nwd" filepath="C:\\Models">
  <selectionsets>
   
    <viewfolder name="Test Packs" guid="${uuid()}">
`;
  for (const [c, g] of groups) {
    out += `      <selectionset name="${esc(c)}" guid="${uuid()}">
        <findspec mode="all" disjoint="1">
          <conditions>
`;
    for (const l of [...g.lines].sort()) out += cond(l);
    out += `          </conditions>
        </findspec>
      </selectionset>
`;
  }
  out += `    </viewfolder>
  </selectionsets>
</exchange>
`;
  return out;
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
let currentBlob = null, currentName = "";
function rowsText(a) { return a.length > 12 ? a.slice(0, 12).join("، ") + ` ... (+${a.length - 12})` : a.join("، "); }
function download() {
  if (!currentBlob) return;
  const url = URL.createObjectURL(currentBlob);
  const a = document.createElement("a");
  a.href = url; a.download = currentName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function showResult(groups, notes, extraCols) {
  const xml = buildXml(groups);
  const chk = new DOMParser().parseFromString(xml, "application/xml");
  if (chk.getElementsByTagName("parsererror").length) throw new Error(TM.tt("ملف XML الناتج غير صالح","The generated XML is not valid"));
  currentName = fileNameFor([...groups.keys()]);
  currentBlob = new Blob(["\uFEFF" + xml], { type: "application/xml" });
  let html = `<h2 class="msg-ok">${groups.size} <span class="en">selectionset</span></h2>
    <table><thead><tr><th>${TM.tt("الدائرة","Circuit")}</th>${extraCols ? '<th class="num">ISO</th><th class="num">Line No</th>' : '<th class="num">ISO</th>'}</tr></thead><tbody>`;
  for (const [c, g] of groups) html += `<tr><td class="circ">${esc(c)}</td>${extraCols ? `<td class="num">${g.isos ?? ""}</td><td class="num">${g.lines.size}</td>` : `<td class="num">${g.lines.size}</td>`}</tr>`;
  html += `</tbody></table><p><span class="fname">${esc(currentName)}</span></p><button class="dl" id="dlbtn">${TM.tt("تحميل","Download")} <span class="en">XML</span></button>`;
  $("result").classList.remove("hidden");
  $("summary").innerHTML = html;
  $("dlbtn").addEventListener("click", download);
  $("notes-card").innerHTML = notes.length ? `<ul class="notes">${notes.join("")}</ul>` : "";
  $("notes-card").classList.toggle("hidden", !notes.length);
}
function showError(msg) { currentBlob = null; $("result").classList.remove("hidden"); $("summary").innerHTML = `<h2 class="msg-err">${esc(msg)}</h2>`; $("notes-card").classList.add("hidden"); }

/* tabs */
function tab(which) {
  $("tabA").classList.toggle("on", which === "A"); $("tabB").classList.toggle("on", which === "B");
  $("panA").classList.toggle("hidden", which !== "A"); $("panB").classList.toggle("hidden", which !== "B");
  $("result").classList.add("hidden");
}
$("tabA").addEventListener("click", () => tab("A")); $("tabB").addEventListener("click", () => tab("B"));

/* option B: uploaded two-column sheet (testpack + ISO/line) */
const k = s => String(s ?? "").trim().toLowerCase().replace(/[\s._()-]+/g, "");
const TP_KEYS = ["testpackno", "testpack", "circuit", "circuittestpackno", "tpno", "tp"];
const ISO_KEYS = ["isonumber", "iso", "isono", "lineno", "line", "linenumber"];
function analyzeTwoCols(rows) {
  let ti = 0, ii = 1, hdr = -1;
  for (const r of rows) {
    const low = r.cells.map(k);
    const a = low.findIndex(x => TP_KEYS.includes(x)), b = low.findIndex(x => ISO_KEYS.includes(x));
    if (a >= 0 && b >= 0) { ti = a; ii = b; hdr = r.n; break; }
  }
  const groups = new Map(), bad = [];
  let first = true;
  for (const r of rows) {
    if (hdr >= 0 ? r.n <= hdr : first) { first = false; continue; }
    first = false;
    const c = String(r.cells[ti] ?? "").trim(), v = String(r.cells[ii] ?? "").trim();
    if (!c && !v) continue;
    if (!c || !v) { bad.push(r.n); continue; }
    let g = groups.get(c); if (!g) { g = { rows: 0, lines: new Set() }; groups.set(c, g); }
    g.rows++; g.lines.add(v);
  }
  return { groups, bad, hdr };
}
$("xlIn").addEventListener("change", async () => {
  const f = $("xlIn").files[0]; if (!f) return;
  try {
    if (!/\.xlsx$/i.test(f.name)) throw new Error(TM.tt("الملف يجب أن يكون .xlsx","File must be .xlsx"));
    const a = analyzeTwoCols(await readFirstSheet(await f.arrayBuffer()));
    if (!a.groups.size) throw new Error(TM.tt("لا توجد صفوف صالحة","No valid rows"));
    const notes = [];
    if (a.bad.length) notes.push(`<li class="msg-err">${a.bad.length} ${TM.tt("صف ناقص تم تجاهله","incomplete rows ignored")}: <span class="en">${rowsText(a.bad)}</span></li>`);
    if (a.hdr < 0) notes.push(`<li class="msg-warn">${TM.tt("لا يوجد عنوان: العمود الأول دائرة والثاني","No header: first column is the circuit, second is")} <span class="en">ISO</span></li>`);
    showResult(a.groups, notes, false);
  } catch (e) { showError(e.message); }
});

/* option A: spool dump from the shared store */
const LINE_KEYS = ["lineno", "line", "linenumber"];
let spoolRef = null; // {name, tp, line, iso}
async function findSpool() {
  spoolRef = null;
  let list = []; try { list = await TM.store.list(); } catch (e) {}
  let seenSpool = false;
  for (const m of list) {
    if (!/\.(xlsb|xlsx|csv)$/i.test(m.name)) continue;
    try {
      const f = await TM.store.get(m.name); if (!f) continue;
      const T = await scanTable(f, m.name, { peek: true });
      if (classifyHeader(T.header) !== "spool") continue;
      seenSpool = true;
      const low = T.header.map(k);
      const tp = low.findIndex(x => TP_KEYS.includes(x)), line = low.findIndex(x => LINE_KEYS.includes(x)), iso = low.findIndex(x => ["isonumber", "iso", "isono"].includes(x));
      if (tp >= 0 && line >= 0) { spoolRef = { name: m.name, tp, line, iso }; return { ok: true }; }
    } catch (e) {}
  }
  return { ok: false, seenSpool, any: list.length > 0 };
}
async function refreshA() {
  const r = await findSpool();
  $("aMissing").classList.toggle("hidden", r.ok); $("aForm").classList.toggle("hidden", !r.ok);
  if (r.ok) { $("aSrc").textContent = spoolRef.name; return; }
  $("aMissingText").innerHTML = r.seenSpool ? TM.tt('<span class="en">Spool Dump</span> لا يحتوي العمودين <span class="en">Line No</span> و <span class="en">Testpack No</span>.','<span class="en">Spool Dump</span> has no <span class="en">Line No</span> or <span class="en">Testpack No</span> column.') : TM.tt('<b><span class="en">Spool Dump</span></b> غير مرفوع. ارفعه من الصفحة الرئيسية.','<b><span class="en">Spool Dump</span></b> not uploaded. Upload it on the home page.');
}
const ptjNum = c => { const m = /(\d{5})-[A-Za-z]$/.exec(c) || /PTJ-?0*(\d+)/i.exec(c); return m ? String(parseInt(m[1], 10)) : null; };
let found = null;
async function searchA() {
  const q = $("tpNum").value.trim(); if (!q || !spoolRef) return;
  const ql = q.toLowerCase(), qn = /^\d+$/.test(q) ? String(parseInt(q, 10)) : null;
  $("aPick").classList.add("hidden"); $("result").classList.add("hidden");
  $("tpGo").disabled = true; $("aSrc").textContent = "...";
  try {
    const f = await TM.store.get(spoolRef.name);
    const hit = new Map(); // tp -> {lines:Set, isos:Set, rows}
    const T = await scanTable(f, spoolRef.name, { onHeader: () => cells => {
      const tp = String(cells[spoolRef.tp] ?? "").trim(); if (!tp) return false;
      return tp.toLowerCase() === ql || (qn !== null ? ptjNum(tp) === qn : tp.toLowerCase().includes(ql));
    } }, n => { $("aSrc").textContent = n.toLocaleString() + " ..."; });
    for (const r of T.rows) {
      const tp = String(r[spoolRef.tp]).trim(), ln = String(r[spoolRef.line] ?? "").trim();
      let g = hit.get(tp); if (!g) { g = { rows: 0, lines: new Set(), isoSet: new Set() }; hit.set(tp, g); }
      g.rows++; if (ln) g.lines.add(ln); if (spoolRef.iso >= 0 && r[spoolRef.iso] != null) g.isoSet.add(String(r[spoolRef.iso]).trim());
    }
    $("aSrc").textContent = spoolRef.name;
    for (const [c, g] of [...hit]) { if (!g.lines.size) hit.delete(c); else g.isos = g.isoSet.size; }
    if (!hit.size) { showError(TM.tt("لا توجد دائرة بهذا الرقم","No circuit with this number")); return; }
    found = hit;
    const names = [...hit.keys()].sort();
    if (names.length === 1) { finishA(names); return; }
    const pre = names.filter(n => /1B03/i.test(n)); const on = pre.length ? pre : names;
    $("aPick").innerHTML = `<div class="note">${TM.tt("عدة دوائر بهذا الرقم. اختر:","Several circuits match. Choose:")}</div>` + names.map((n, i) => `<label class="pk"><input type="checkbox" value="${i}" ${on.includes(n) ? "checked" : ""}> <span class="en">${esc(n)}</span> <small>(${hit.get(n).lines.size})</small></label>`).join("") + `<button type="button" class="pri" id="pkGo" style="margin-top:10px">${TM.tt("إنشاء","Create")}</button>`;
    $("aPick").classList.remove("hidden");
    $("pkGo").addEventListener("click", () => { const ch = [...$("aPick").querySelectorAll("input:checked")].map(x => names[+x.value]); if (ch.length) finishA(ch); });
  } catch (e) { showError(e.message); $("aSrc").textContent = spoolRef.name; }
  finally { $("tpGo").disabled = false; }
}
function finishA(names) {
  const g = new Map(); for (const n of names) g.set(n, found.get(n));
  showResult(g, [], true);
}
$("tpGo").addEventListener("click", searchA);
$("tpNum").addEventListener("keydown", e => { if (e.key === "Enter") searchA(); });
TM.store.onchange(refreshA); refreshA();
window.__tpTool = { readFirstSheet, analyze, buildXml, fileNameFor, getBlob: () => currentBlob, getName: () => currentName };
</script>
