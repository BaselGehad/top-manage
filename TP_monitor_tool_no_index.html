/* ================= generic helpers ================= */

/* ================= zip (Blob based, streaming) ================= */

  if (eocd < 0) throw new Error(TM.tt("الملف ليس بصيغة zip/xlsx/xlsb صحيحة","Not a valid zip/xlsx/xlsb file"));

    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error(TM.tt("ملف zip تالف","Corrupt zip file"));

/* ================= XLSB records ================= */

async function readXlsb(blob, zip, onRow, sheetEntry) {

/* ================= XLSX streaming ================= */

    const cx = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(st);
    if (cx) for (const m of cx[1].matchAll(/<xf\b[^>]*?numFmtId="(\d+)"/g)) { const f = +m[1]; dateXf.push(BUILTIN_DATE.has(f) || (fm[f] != null && isDateFmtStr(fm[f]))); }
  }

/* ================= CSV streaming ================= */
async function readCsv(blob, onRow) {

/* ================= unified reader ================= */

/* scan(blob, name, {sheetName, onHeader(header)->keep(cells)|null , peek}) */
async function scanTable(blob, name, opts, progress) {

    if (!gotHeader) {
      if (!cells.length) return false;
      gotHeader = true; for (let i = 0; i < cells.length; i++) header[i] = norm(cells[i]);
      for (let i = 0; i < header.length; i++) if (header[i] === undefined) header[i] = "";

    }

    if (!cells.length) return false;

      const row = new Array(header.length);

/* ================= xlsx writer ================= */

    if (s.rels.length) files.push({ name: `xl/worksheets/_rels/sheet${i + 1}.xml.rels`, data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${s.rels.map((t, j) => `<Relationship Id="rId${j + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table${t === 1 ? 1 : t === 2 ? 2 : 3}.xml"/>`).join("")}</Relationships>`) });
  });
  tables.forEach((t, i) => files.push({ name: `xl/tables/table${i + 1}.xml`, data: enc.encode(t.xml) }));
  files.push({ name: "xl/sharedStrings.xml", data: enc.encode(sst.xml()) });
  const blob = await makeZip(files);
  return { blob, stats: { isos: nIso, subAreas: subAreas.length, totalLen, spoolRows: sdump.rowsN, weldRowsDump: wdump.rowsN, weldRowsStatus: wsRows.length, wRowsAll, wCancelled, wNoFactor, wOfCancSp, cancelledSpools, missingSpool }, warn };
}

/* ================= index ================= */
let INDEX = null; // {date, source, circuits: {name:[iso...]}}
const ptjOf = c => { const m = /(\d{5})-[A-Za-z]$/.exec(c); return m ? m[1] : null; };
function setIndex(obj, source) { INDEX = obj; INDEX.source = source; const n = Object.keys(obj.circuits).length; if (!n) { document.getElementById("indexInfo").innerHTML = `<div class="err">${TM.tt("فهرس الدوائر غير مرفوع. ارفعه من الصفحة الرئيسية.","Circuit index not uploaded. Upload it on the home page.")}</div>`; return; } document.getElementById("indexInfo").innerHTML = `${TM.tt("الفهرس","Index")}: <span class="en">${esc(source)}</span> · ${n} ${TM.tt("دائرة","circuits")} · ${TM.tt("تاريخ البيانات","data date")} <span class="en">${esc(obj.date || "?")}</span>`; }
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
async function indexFromFile(file) {
  const circuits = {}; let ci = -1, ii = -1, got = false;
  const T = await scanTable(file, file.name, { sheetName: "Circuit-ISO", onHeader: h => { ci = h.findIndex(x => x.toLowerCase().startsWith("circuit")); ii = h.findIndex(x => x.toLowerCase() === "iso number"); if (ci < 0 || ii < 0) return null; got = true; return cells => { const c = norm(cells[ci]), i = norm(cells[ii]); if (c && i) (circuits[c] || (circuits[c] = [])).push(i); return false; }; } });
  if (!got) throw new Error(TM.tt("ملف الفهرس يجب أن يحتوي ورقة Circuit-ISO بعمودي Circuit و ISO Number","The index file needs a Circuit-ISO sheet with Circuit and ISO Number columns"));
  for (const k in circuits) circuits[k] = [...new Set(circuits[k])];
  return { date: TM.tt("من ","from ") + file.name, circuits };
}
/* ================= IndexedDB ================= */
function idb() { return new Promise((res, rej) => { const q = indexedDB.open("tp-monitor", 1); q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvGet(k) { try { const db = await idb(); return await new Promise((res, rej) => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return undefined; } }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
/* ================= files ================= */
let dirHandle = null, manualFiles = [], lastScan = [];
const $ = id => document.getElementById(id);
async function listDir(h) { const out = []; for await (const [name, e] of h.entries()) if (e.kind === "file") out.push(await e.getFile()); return out; }
const fmtMB = n => (n / 1048576).toFixed(1) + " MB";
function groupFiles(files) { // -> [{key, parts:[File], label, size, mtime}]
  const groups = new Map();
  for (const f of files) {
    const pm = /\.part(\d+)$/i.exec(f.name);
    let key = f.name, order = 0;
    if (pm) { key = f.name.replace(/\.part\d+$/i, "").replace(/-[0-9a-f]{8}$/i, "").replace(/^\d\d-/, ""); order = +pm[1]; }
    else if (!/\.(xlsb|xlsx|csv)$/i.test(f.name)) continue;
    if (!groups.has(key)) groups.set(key, []); groups.get(key).push({ f, order });
  }
  return [...groups.entries()].map(([key, arr]) => { arr.sort((a, b) => a.order - b.order); const parts = arr.map(x => x.f); return { key, parts, size: parts.reduce((a, f) => a + f.size, 0), mtime: Math.max(...parts.map(f => f.lastModified || 0)), sig: parts.map(f => f.name + f.size + f.lastModified).join("|") }; });
}
const classCache = new Map();
async function classify(files) {
  const gs = groupFiles(files); const out = { spool: [], weld: [], index: [], other: [] };
  for (const g of gs) {
    let cls = classCache.get(g.sig);
    if (!cls) { try { const blob = g.parts.length === 1 ? g.parts[0] : new Blob(g.parts); const T = await scanTable(blob, g.key, { peek: true }); cls = classifyHeader(T.header); } catch (e) { cls = "other"; } classCache.set(g.sig, cls); }
    out[cls].push(g);
  }
  for (const k of ["spool", "weld", "index"]) out[k].sort((a, b) => b.mtime - a.mtime);
  return out;
}
function renderFiles(cls, note) {
  const row = (g, t) => `<tr><td>${t}</td><td class="l">${esc(g.key)}${g.parts.length > 1 ? ` (${g.parts.length} parts)` : ""}</td><td>${fmtMB(g.size)}</td><td class="l">${g.mtime ? new Date(g.mtime).toISOString().slice(0, 16).replace("T", " ") : ""}</td></tr>`;
  let h = (note ? `<div>${note}</div>` : "") + `<table><tbody>`;
  h += cls.spool.length ? row(cls.spool[0], '<span class="ok">Spool Dump</span>') : `<tr><td colspan="4" class="err">${TM.tt("لا يوجد","No")} Spool Dump</td></tr>`;
  h += cls.weld.length ? row(cls.weld[0], '<span class="ok">Weld Dump</span>') : `<tr><td colspan="4" class="err">${TM.tt("لا يوجد","No")} Weld Dump</td></tr>`;
  h += `</tbody></table>`;
  if (cls.spool.length > 1 || cls.weld.length > 1) h += `<div class="warn">${TM.tt("عدة ملفات من النوع نفسه: يُستخدم الأحدث.","Several files of the same type: using the newest.")}</div>`;
  $("fileList").innerHTML = h;
}
let usingStore = false;
async function currentFiles() { usingStore = false; if (dirHandle) return await listDir(dirHandle); if (manualFiles.length) return manualFiles; try { const f = window.TM ? await TM.store.files() : []; usingStore = f.length > 0; return f; } catch (e) { return []; } }
async function refreshFiles(note) {
  try { const files = await currentFiles(); if (!files.length) { $("fileList").innerHTML = ""; return null; } $("fileList").innerHTML = "جاري فحص الملفات..."; const cls = await classify(files); lastScan = cls; renderFiles(cls, note); return cls; }
  catch (e) { $("fileList").innerHTML = `<span class="err">${esc(e.message)}</span>`; return null; }
}
async function setDir(h) { dirHandle = h; clearManual(); await kvSet("dir", h); $("btnAllow").classList.add("hidden"); await refreshFiles(`الفولدر: <span class="en">${esc(h.name)}</span>`); }
async function initDir() {
  if (!window.showDirectoryPicker) { $("btnPick").classList.add("hidden"); $("fileList").innerHTML = `<span class="warn">المتصفح ده مش بيدعم اختيار الفولدر. استخدم <span class="en">Chrome</span> أو <span class="en">Edge</span>، أو اختار الملفات يدويًا.</span>`; return; }
  const h = await kvGet("dir"); if (!h) return;
  try { const p = await h.queryPermission({ mode: "read" }); if (p === "granted") { await setDir(h); } else { dirHandle = h; $("btnAllow").classList.remove("hidden"); $("fileList").innerHTML = `الفولدر المحفوظ: <span class="en">${esc(h.name)}</span>. دوس "اسمح بقراءة الفولدر".`; } } catch (e) { /* ignore */ }
}
$("btnPick").addEventListener("click", async () => { try { const h = await showDirectoryPicker({ mode: "read" }); await setDir(h); } catch (e) { if (e.name !== "AbortError") $("fileList").innerHTML = `<span class="err">${esc(e.message)}</span>`; } });
$("btnAllow").addEventListener("click", async () => { try { const p = await dirHandle.requestPermission({ mode: "read" }); if (p === "granted") await setDir(dirHandle); } catch (e) { $("fileList").innerHTML = `<span class="err">${esc(e.message)}</span>`; } });
$("btnReload").addEventListener("click", async () => { classCache.clear(); await refreshFiles("تم إعادة فحص الملفات."); });
let manualCls = new Map(); // File -> class
async function takeManual(list) {
  const nf = [...list]; if (!nf.length) return; dirHandle = null;
  $("fileList").innerHTML = "جاري فحص الملفات...";
  try {
    const gs = groupFiles(nf);
    for (const g of gs) {
      let cls; try { const blob = g.parts.length === 1 ? g.parts[0] : new Blob(g.parts); const T = await scanTable(blob, g.key, { peek: true }); cls = classifyHeader(T.header); } catch (e) { cls = "other"; }
      if (cls === "spool" || cls === "weld") { for (const [f, c] of [...manualCls]) if (c === cls) { manualCls.delete(f); manualFiles = manualFiles.filter(x => x !== f); } for (const f of g.parts) { manualCls.set(f, cls); manualFiles.push(f); } }
      else if (cls === "index") $("fileList").innerHTML = `<span class="warn">الملف ${esc(g.key)} ده فهرس مش Dump. استخدم خانة تحديث الفهرس.</span>`;
      else $("fileList").innerHTML = `<span class="warn">الملف ${esc(g.key)} مش Spool Dump ولا Weld Dump (اتجاهل).</span>`;
    }
    const msg = $("fileList").innerHTML.includes("warn") ? $("fileList").innerHTML : "";
    await refreshFiles("الملفات المختارة بتتضاف لبعض: لو اخترت ملف من نفس النوع بيتبدل بس." + msg);
  } catch (e) { $("fileList").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
function clearManual() { manualFiles = []; manualCls = new Map(); $("fileList").innerHTML = ""; }
$("btnClear").addEventListener("click", () => { clearManual(); if (dirHandle) refreshFiles(); else if (window.syncStore) syncStore(); });
$("fallbackInput").addEventListener("change", async e => { await takeManual(e.target.files); e.target.value = ""; });
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => takeManual(e.dataTransfer.files));
window.addEventListener("dragover", e => e.preventDefault()); window.addEventListener("drop", e => e.preventDefault());
$("indexInput").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; try { const idx = await indexFromFile(f); setIndex(idx, f.name); await kvSet("index", idx); } catch (err) { $("indexInfo").innerHTML = `<span class="err">${esc(err.message)}</span>`; } });

/* ================= circuit resolve + run ================= */
let chosen = null;
function resolveCircuit(input) {
  const t = input.trim(); if (!t) return { error: TM.tt("أدخل رقم الدائرة","Enter the circuit number") };
  const names = Object.keys(INDEX.circuits);
  if (INDEX.circuits[t]) return { list: [t] };
  const digits = t.replace(/\D/g, ""); if (!digits || digits.length > 5) return { error: TM.tt("رقم غير مفهوم","Invalid number") };
  const p = digits.padStart(5, "0"); const list = names.filter(n => ptjOf(n) === p);
  return list.length ? { list } : { error: TM.tt(`الدائرة ${p} غير موجودة في الفهرس`, `Circuit ${p} is not in the index`) };
}
function showChoices(list) { $("choices").innerHTML = `<div class="warn" style="margin-top:8px">${TM.tt("عدة دوائر بهذا الرقم. اختر:","Several circuits match. Choose:")}</div>` + list.map((n, i) => `<label style="display:block;margin:4px 0"><input type="radio" name="ch" value="${esc(n)}"${i === 0 ? "" : ""}> <span class="en">${esc(n)}</span> (${INDEX.circuits[n].length} ISO)</label>`).join(""); }
function progress(t, pct) { $("progCard").classList.remove("hidden"); $("progText").textContent = t; if (pct != null) $("prog").value = pct; }
let lastBlob = null, lastName = "";
async function run() {
  $("outCard").classList.add("hidden"); lastBlob = null;
  try {
    if (!Object.keys(INDEX.circuits).length) { $("choices").innerHTML = `<div class="err">${TM.tt("فهرس الدوائر غير مرفوع. ارفعه من الصفحة الرئيسية.","Circuit index not uploaded. Upload it on the home page.")}</div>`; return; }
    const r = resolveCircuit($("circ").value); if (r.error) { $("choices").innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
    let circuit;
    if (r.list.length === 1) { circuit = r.list[0]; $("choices").innerHTML = ""; }
    else { const sel = document.querySelector('input[name="ch"]:checked'); if (!sel || !r.list.includes(sel.value)) { showChoices(r.list); return; } circuit = sel.value; }
    const isos = INDEX.circuits[circuit];
    $("btnGo").disabled = true;
    progress(TM.tt("فحص الملفات...","Checking files..."), 2);
    const files = await currentFiles(); classCache.clear(); const cls = await classify(files); lastScan = cls; renderFiles(cls);
    if (!cls.spool.length || !cls.weld.length) throw new Error(TM.tt("يلزم وجود Spool Dump و Weld Dump","Spool Dump and Weld Dump are required"));
    const isoSet = new Set(isos);
    const mk = g => g.parts.length === 1 ? g.parts[0] : new Blob(g.parts);
    const reader = (label, base) => async g => { let ic = -1; const T = await scanTable(mk(g), g.key, { onHeader: h => { ic = isoColOf(h); if (ic < 0) throw new Error(TM.tt("لا يوجد عمود ISO في ملف ","No ISO column in ") + label); return cells => isoSet.has(norm(cells[ic])); } }, n => progress(`${TM.tt("قراءة","Reading")} ${label}: ${n.toLocaleString()} ${TM.tt("صف","rows")}`, base)); return T; };
    progress(TM.tt("قراءة Spool Dump...","Reading Spool Dump..."), 10); const spool = await reader("Spool Dump", 15)(cls.spool[0]);
    progress(TM.tt("قراءة Weld Dump (قد تستغرق دقيقة)...","Reading Weld Dump (may take a minute)..."), 40); const weld = await reader("Weld Dump", 60)(cls.weld[0]);
    progress(TM.tt("إنشاء ملف Excel...","Building Excel file..."), 90);
    const res = await buildMonitor(circuit, isos, spool, weld, { excludeCancelled: document.querySelector('input[name="cmode"]:checked').value === "b" });
    const ptj = ptjOf(circuit) || "circuit";
    lastName = `Monitor_${ptj}_${(/-([A-Z]{3})-PTJ/.exec(circuit) || [, ""])[1]}.xlsx`.replace("_.xlsx", ".xlsx"); if (document.querySelector('input[name="cmode"]:checked').value === "b") lastName = lastName.replace(".xlsx", "_no_cancelled.xlsx");
    lastBlob = res.blob;
    progress(TM.tt("تم","Done"), 100);
    const s = res.stats;
    $("outCard").classList.remove("hidden");
    $("outCard").innerHTML = `<h2 class="ok">${TM.tt("تم إنشاء الملف","File created")}</h2>
      <table><tbody>
      <tr><td>${TM.tt("الدائرة","Circuit")}</td><td class="l">${esc(circuit)}</td></tr>
      <tr><td>${TM.tt("عدد","Count of")} ISO (<span class="en">LINE STATUSS</span>)</td><td>${s.isos} · ${s.subAreas} <span class="en">sub area</span> · ${TM.tt("الطول","length")} ${s.totalLen.toFixed(2)} ${TM.tt("م","m")}</td></tr>
      <tr><td><span class="en">SPOOL DUMP</span></td><td>${s.spoolRows} ${TM.tt("صف","rows")} (${TM.tt("من","of")} ${spool.scanned.toLocaleString()} ${TM.tt("صف في الملف","rows in file")})</td></tr>
      <tr><td><span class="en">WELD DUMP</span></td><td>${s.weldRowsDump} ${TM.tt("صف","rows")} · <span class="en">WELDING STATUS</span>: ${s.weldRowsStatus} ${TM.tt("صف","rows")} (${TM.tt("استبعاد","excluded")} ${s.wCancelled}${s.wOfCancSp ? " + " + s.wOfCancSp + " " + TM.tt("لحام سبولة ملغية","welds of cancelled spools") : ""} <span class="en">Cancelled</span> ${TM.tt("و","and")} ${s.wNoFactor} ${TM.tt("لحام","welds with")} <span class="en">Dia Inch Factor</span> ${TM.tt("ليس","not")} <span class="en">Y</span>)</td></tr>
      <tr><td>${TM.tt("الملف","File")}</td><td class="l">${esc(lastName)}</td></tr></tbody></table>
      <ul class="notes">${res.warn.map(w => `<li class="warn">${esc(w)}</li>`).join("")}
      <li>${TM.tt("عمود","Column")} <span class="en">ten check</span> ${TM.tt("فارغ.","is empty.")}</li>
      <li>${TM.tt("المعادلات حية: اكتب","Live formulas: enter")} <span class="en">DONE</span> ${TM.tt("في عمود","in column")} <span class="en">STATUS</span>.</li></ul>
      <button class="pri" id="btnDl">${TM.tt("تحميل","Download")} <span class="en">Excel</span></button>`;
    $("btnDl").addEventListener("click", dl);
    window.__monResult = { circuit, stats: s, warn: res.warn, name: lastName };
  } catch (e) { progress(TM.tt("فشل","Failed"), 0); $("outCard").classList.remove("hidden"); $("outCard").innerHTML = `<h2 class="err">${esc(e.message || e)}</h2>`; console.error(e); window.__monError = String(e && e.stack || e); }
  finally { $("btnGo").disabled = false; }
}
function dl() { if (!lastBlob) return; const u = URL.createObjectURL(lastBlob); const a = document.createElement("a"); a.href = u; a.download = lastName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); }
$("btnGo").addEventListener("click", run);
$("circ").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
window.__mon = { run, getBlob: () => lastBlob, getName: () => lastName, setFiles: takeManual, setMockDir: async fl => { dirHandle = { name: "mock", entries: async function* () { for (const f of fl) yield [f.name, { kind: "file", getFile: async () => f }]; } }; manualFiles = []; await refreshFiles("mock dir"); } };
/* ================= boot ================= */
/* ---- Top Manage shared store hook (additive) ---- */
async function storeIndex() { // use an index sheet from the shared store when one is there (any stored file that is not a spool/weld dump and has a Circuit-ISO sheet)
  if (!window.TM) return false;
  try { const fs = await TM.store.files(); for (const f of fs) { try { let cls = "other"; try { const T = await scanTable(f, f.name, { peek: true }); cls = classifyHeader(T.header); } catch (e) {} if (cls === "spool" || cls === "weld") continue; const idx = await indexFromFile(f); if (Object.keys(idx.circuits).length) { setIndex(idx, f.name + " (" + TM.tt("من مخزن البيانات","from the data store") + ")"); await kvSet("index", idx); return true; } } catch (e) {} } } catch (e) {}
  return false;
}
function tmHideUploads() { // no upload inside this tool: files come from the home page
  const card = $("filesCard"); for (const el of [...card.children]) if (!["tmStoreNote", "fileList"].includes(el.id) && el.tagName !== "H2") el.classList.add("hidden");
  const ii = $("indexInput"); if (ii) { const n = ii.closest(".note"); if (n) n.classList.add("hidden"); }
}
async function syncStore() {
  if (!window.TM) return;
  tmHideUploads();
  await storeIndex(); classCache.clear();
  const files = await currentFiles(); const cls = files.length ? await refreshFiles(TM.tt("من مخزن البيانات","from the data store")) : null;
  if (!files.length) $("fileList").innerHTML = "";
  const miss = [];
  if (!cls || !cls.spool.length) miss.push('<b>Spool Dump</b> ');
  if (!cls || !cls.weld.length) miss.push('<b>Weld Dump</b> ');
  if (!Object.keys(INDEX.circuits).length) miss.push('<b>${TM.tt("فهرس الدوائر","Circuit index")}</b> <span class="en">Circuit_to_ISO_index.xlsx</span>');
  if (miss.length) {
    $("tmStoreNote").innerHTML = `<h2 class="warn">${TM.tt("الشيتات الناقصة","Missing sheets")}</h2><ul class="notes">${miss.map(x => `<li>${x}</li>`).join("")}</ul><p style="margin:10px 0 12px">${TM.tt("ارفعها من الصفحة الرئيسية.","Upload them on the home page.")}</p><a class="tm-btn" href="index.html#data" style="display:inline-flex">${TM.tt("رفع الملفات من الصفحة الرئيسية ←","Upload files on the home page \u2192")}</a>`;
    $("indexInfo").innerHTML = ""; $("btnGo").disabled = true;
  } else { $("tmStoreNote").innerHTML = `<span class="ok">${TM.tt("كل الشيتات المطلوبة موجودة.","All required sheets are present.")}</span>`; $("btnGo").disabled = false; }
}
(async () => {
  let idx = await kvGet("index");
  if (idx && idx.circuits) setIndex(idx, TM.tt("محفوظ على الجهاز","saved on device")); else setIndex(JSON.parse(document.getElementById("embeddedIndex").textContent), TM.tt("مدمج في الأداة","built in"));
  await syncStore();
  if (window.TM) TM.store.onchange(syncStore);
})();
